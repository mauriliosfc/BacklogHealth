<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Backlog Health</title>
<style>
  :root {
    --bg: #ffffff; --border: #e2e8f0; --text: #0f172a; --muted: #64748b;
    --accent: #6366f1; --track: #e0e7ff;
  }
  :root[data-theme="dark"] {
    --bg: #0f172a; --border: #1e293b; --text: #f1f5f9; --muted: #94a3b8;
    --accent: #818cf8; --track: #1e293b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    border: 1px solid var(--border);
    user-select: none; -webkit-app-region: drag; cursor: default; overflow: hidden;
  }
  .logo { width: 72px; height: 72px; }
  .name { font-size: 20px; font-weight: 600; letter-spacing: .2px; }
  .msg  { font-size: 13px; color: var(--muted); min-height: 18px; text-align: center; padding: 0 24px; }
  .bar  { width: 180px; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .bar::after {
    content: ''; display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--accent);
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  :root[data-static] .bar { display: none; }
</style>
</head>
<body>
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
    <rect width="512" height="512" rx="118" fill="#0f172a"/>
    <line x1="44" y1="329" x2="468" y2="329" stroke="#818cf8" stroke-width="4" stroke-opacity="0.15"/>
    <path d="M 44,329 L 132,329 L 168,395 L 256,132 L 329,329 L 468,329"
          fill="none" stroke="#818cf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="132" r="20" fill="#c7d2fe"/>
  </svg>
  <div class="name">Backlog Health</div>
  <div class="msg" id="msg"></div>
  <div class="bar" role="progressbar" aria-busy="true"></div>
<script>
  // Parâmetros vindos do processo principal: theme (dark|light), text, static (imagem do portátil)
  var q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = q.get('theme') === 'dark' ? 'dark' : 'light';
  if (q.has('static')) document.documentElement.dataset.static = '';
  document.getElementById('msg').textContent = q.get('text') || '';
</script>
</body>
</html>
